services:
  postgres:
    image: postgres:17
    container_name: artificial_u_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artificial_u_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: artificial_u_minio
    ports:
      - "${MINIO_PORT:-9000}:9000" # API port
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Console port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO client for bucket setup
  mc:
    image: minio/mc:latest
    container_name: artificial_u_mc
    depends_on:
      - minio
    volumes:
      - ./scripts/mc_setup.sh:/usr/bin/mc_setup.sh
    environment:
      MINIO_PORT: ${MINIO_PORT:-9000}
    entrypoint:
      - sh
      - -c
      - '/usr/bin/mc_setup.sh "${MINIO_PORT}"'

volumes:
  postgres_data:
  minio_data:
