services:
  postgres:
    image: postgres:17
    container_name: artificial_u_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artificial_u_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local development (production uses AWS S3).
  # RustFS replaced MinIO after MinIO withdrew its public container images.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: artificial_u_rustfs
    ports:
      - "${STORAGE_PORT:-9000}:9000" # S3 API
      - "${STORAGE_CONSOLE_PORT:-9001}:9001" # Web console
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create buckets, public-read policy, and CORS (mirrors the CDK S3 config)
  storage-setup:
    image: amazon/aws-cli:latest
    container_name: artificial_u_storage_setup
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./scripts/storage_setup.sh:/storage_setup.sh:ro
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      STORAGE_ENDPOINT: http://rustfs:9000
    entrypoint: ["sh", "/storage_setup.sh"]

volumes:
  postgres_data:
  rustfs_data:
