name: Run Tests

# Trigger on pushes and pull requests to main branches
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    # Service containers to run alongside the job
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artificial_u_test
        ports:
          - 5432:5432
        # Health checks to wait until postgres is ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pipx and hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install hatch

      - name: Start MinIO server
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest \
            server /data --console-address ":9001"

          # Wait for MinIO to be ready
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO to start... ($i/30)"
            sleep 2
          done

      - name: Set up MinIO buckets
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: |
          # Install MinIO client
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

          # Configure MinIO client
          mc alias set testminio $MINIO_ENDPOINT $MINIO_ACCESS_KEY $MINIO_SECRET_KEY

          # Create buckets
          mc mb testminio/artificial-u-audio --ignore-existing
          mc mb testminio/artificial-u-lectures --ignore-existing
          mc mb testminio/artificial-u-images --ignore-existing
          mc mb testminio/artificial-u-exports --ignore-existing
          mc mb testminio/artificial-u-content-logs --ignore-existing

          # Set public policy for buckets (optional, adjust as needed)
          mc anonymous set download testminio/artificial-u-audio
          mc anonymous set download testminio/artificial-u-lectures
          mc anonymous set download testminio/artificial-u-images
          mc anonymous set download testminio/artificial-u-exports
          mc anonymous set download testminio/artificial-u-content-logs

      - name: Create .env.test file
        run: |
          cat > .env.test << EOF
          # Test environment configuration
          TESTING=true
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/artificial_u_test

          # Storage configuration for MinIO
          STORAGE_TYPE=minio
          STORAGE_ENDPOINT_URL=http://localhost:9000
          STORAGE_PUBLIC_URL=http://localhost:9000
          STORAGE_ACCESS_KEY=minioadmin
          STORAGE_SECRET_KEY=minioadmin
          STORAGE_REGION=us-east-1
          STORAGE_AUDIO_BUCKET=artificial-u-audio
          STORAGE_LECTURES_BUCKET=artificial-u-lectures
          STORAGE_IMAGES_BUCKET=artificial-u-images
          STORAGE_EXPORTS_BUCKET=artificial-u-exports
          STORAGE_CONTENT_LOGS_BUCKET=artificial-u-content-logs

          # Mock API keys (for tests that don't make real API calls)
          ANTHROPIC_API_KEY=test-key-mock
          ELEVENLABS_API_KEY=test-key-mock
          GOOGLE_API_KEY=test-key-mock
          OPENAI_API_KEY=test-key-mock

          # Auth0 configuration (mock values for testing)
          AUTH0_DOMAIN=test.auth0.com
          AUTH0_AUDIENCE=https://api.artificial-u.test

          # Logging
          LOG_LEVEL=WARNING
          EOF

      - name: Set up test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artificial_u_test
          TESTING: "true"
        run: |
          hatch run python scripts/setup_test_db.py

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artificial_u_test
          TESTING: "true"
        run: |
          hatch run pytest -m unit -v --cov=artificial_u --cov-report=xml --cov-report=term

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artificial_u_test
          TESTING: "true"
        run: |
          hatch run pytest -m integration -v --cov=artificial_u --cov-append --cov-report=xml --cov-report=term

      - name: Run all other tests (not marked as unit or integration)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artificial_u_test
          TESTING: "true"
        run: |
          hatch run pytest -m "not unit and not integration and not slow" -v --cov=artificial_u --cov-append --cov-report=xml --cov-report=term

      - name: Upload coverage reports to Codecov (optional)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Display coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully"
          fi
