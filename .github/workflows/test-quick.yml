name: Quick Tests (Unit Only)

# Run on all pushes and PRs for faster feedback
on:
  push:
    branches:
      - main
    paths:
      - "artificial_u/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-quick.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "artificial_u/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test-quick.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Create minimal .env.test file
        run: |
          cat > .env.test << EOF
          # Minimal test environment for unit tests
          TESTING=true
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/artificial_u_test

          # Mock API keys
          ANTHROPIC_API_KEY=test_anthropic_key
          ELEVENLABS_API_KEY=test_elevenlabs_key
          MISTRAL_API_KEY=test_mistral_key
          XAI_API_KEY=test_xai_key
          GOOGLE_API_KEY=test_google_key
          OPENAI_API_KEY=test_openai_key

          # Storage (not used in unit tests)
          STORAGE_TYPE=minio
          STORAGE_ENDPOINT_URL=http://localhost:9000
          STORAGE_ACCESS_KEY=minioadmin
          STORAGE_SECRET_KEY=minioadmin

          # Logging
          LOG_LEVEL=WARNING
          EOF

      - name: Run linting checks
        run: |
          uv run flake8 artificial_u --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run black --check artificial_u
          uv run isort --check-only artificial_u

      - name: Run unit tests only
        run: |
          uv run pytest -m unit -v --cov=artificial_u --cov-report=term

      - name: Display test summary
        if: always()
        run: |
          echo "Unit tests completed"
