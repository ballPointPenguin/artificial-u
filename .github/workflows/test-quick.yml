name: Quick Tests (Unit Only)

# Run on all pushes and PRs for faster feedback
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pipx and hatch
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          pipx install hatch

      - name: Create minimal .env.test file
        run: |
          cat > .env.test << EOF
          # Minimal test environment for unit tests
          TESTING=true
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/artificial_u_test

          # Mock API keys
          ANTHROPIC_API_KEY=test-key-mock
          ELEVENLABS_API_KEY=test-key-mock
          GOOGLE_API_KEY=test-key-mock
          OPENAI_API_KEY=test-key-mock

          # Storage (not used in unit tests)
          STORAGE_TYPE=minio
          STORAGE_ENDPOINT_URL=http://localhost:9000
          STORAGE_ACCESS_KEY=minioadmin
          STORAGE_SECRET_KEY=minioadmin

          # Logging
          LOG_LEVEL=WARNING
          EOF

      - name: Run linting checks
        run: |
          hatch run flake8 artificial_u --count --select=E9,F63,F7,F82 --show-source --statistics
          hatch run black --check artificial_u
          hatch run isort --check-only artificial_u

      - name: Run unit tests only
        run: |
          hatch run pytest -m unit -v --cov=artificial_u --cov-report=term

      - name: Display test summary
        if: always()
        run: |
          echo "Unit tests completed"
