[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artificial_u"
version = "0.2.0"
description = "AI-powered educational content platform"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Bennie Rosas", email = "ben@aliencyb.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
keywords = ["education", "ai", "text-to-speech", "lecture"]
dependencies = [
    "aiolimiter>=1.2.1",
    "alembic>=1.17.1",
    "anthropic>=0.74.1",
    "boto3>=1.41.1",
    "click>=8.2.0",
    "elevenlabs>=2.24.0",
    "fastapi>=0.121.3",
    "google-api-core>=2.28.1",
    "google-genai>=1.52.0",
    "gunicorn>=23.0.0",
    "httpx>=0.28.0",
    "mutagen>=1.47.0",
    "openai>=2.8.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.10.0",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.6",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.9.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.17.1",
    "numpy>=2.3.4",
    "audioop-lts>=0.2.2",
    "pedalboard>=0.9.19",
    "pip-tools>=7.5.0",
    "pre-commit>=4.3.0",
    "pydub>=0.25.1",
    "pyloudnorm>=0.1.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-mock>=3.15.1",
    "soundfile>=0.13.1",
]
test = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-mock>=3.15.1",
]

[project.urls]
"Homepage" = "https://github.com/ballPointPenguin/artificial-u"
"Bug Tracker" = "https://github.com/ballPointPenguin/artificial-u/issues"

[project.scripts]
artificial_u = "artificial_u.cli:cli"

[tool.hatch.envs.default]
python = "3.14"
features = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Tests that take a long time to run",
    "demo: Demonstration tests",
    "api: Tests for the API endpoints",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length =100
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | web
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".git", "venv", ".venv", ".mypy_cache", "__pycache__", "web"]
known_first_party = ["artificial_u"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "silent"
exclude = [
    "alembic",
    "scripts",
    "tests",
    "web"
]
