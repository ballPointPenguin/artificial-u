[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artificial_u"
version = "0.2.0"
description = "AI-powered educational content platform"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Bennie Rosas", email = "ben@aliencyb.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
keywords = ["education", "ai", "text-to-speech", "lecture"]
dependencies = [
    "aiolimiter>=1.3.0",
    "alembic>=1.20.0",
    "anthropic>=1.9.0",
    "boto3>=1.43.104",
    "click>=8.5.0",
    "dashscope>=1.27.7",
    "elevenlabs>=2.70.0",
    "fastapi>=0.141.1",
    "google-api-core>=2.39.0",
    "google-genai>=2.25.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "mistralai>=3.0.0",
    "mutagen>=1.48.1",
    "openai>=3.20.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

# PEP 735 dependency groups (managed by uv; `dev` is installed by default with `uv sync`)
[dependency-groups]
dev = [
    { include-group = "test" },
    "aws-cdk-lib>=2.271.0",
    "black>=26.5.1",
    "constructs>=10.8.1",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.1",
    "pytest-mock>=3.16.0",
]

[project.urls]
"Homepage" = "https://github.com/ballPointPenguin/artificial-u"
"Bug Tracker" = "https://github.com/ballPointPenguin/artificial-u/issues"

[project.scripts]
artificial_u = "artificial_u.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Tests that take a long time to run",
    "demo: Demonstration tests",
    "api: Tests for the API endpoints",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length =100
target-version = ["py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | web
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".git", "venv", ".venv", ".mypy_cache", "__pycache__", "web"]
known_first_party = ["artificial_u"]

[tool.ruff]
# Match CI (3.14): bracketless multi-exception `except` is valid on 3.14+ only.
target-version = "py314"
line-length = 100
extend-exclude = ["alembic", "scripts", "web"]

[tool.ruff.lint]
# IDE/local syntax checks only; CI still uses flake8/black/isort via pre-commit.
select = []

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "silent"
exclude = [
    "alembic",
    "scripts",
    "tests",
    "web"
]
